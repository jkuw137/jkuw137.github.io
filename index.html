<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Joe Kuwano — Engineering Portfolio</title>
<meta name="description" content="Engineering portfolio of Joe Kuwano — mechanical design, embedded electronics, rocketry and illustration." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231E2F5C'/%3E%3Cpath d='M16 6c3 4 3 16 0 20-3-4-3-16 0-20z' fill='%238FC1E8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Murecho:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="#top" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="30" height="30">
          <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 4"/>
          <path d="M20 9c4 4.5 4 17.5 0 22-4-4.5-4-17.5 0-22z" fill="currentColor"/>
          <circle cx="20" cy="15" r="1.6" fill="var(--twilight)"/>
        </svg>
      </span>
      <span class="brand-name">Joe Kuwano</span>
    </a>

    <header class="nav" id="nav">
      <a href="#hero" class="nav__mark">✦ Joe Kuwano</a>

        <nav class="nav__links" id="navInner">
          <a href="#about" data-nav="about"></a>
          <a href="#projects" data-nav="projects"></a>
          <a href="#gallery" data-nav="gallery"></a>
          <a href="#contact" data-nav="contact"></a>
        </nav>

        <div class="nav__right">
          <div class="lang-toggle">
            <button id="btnEn">EN</button>
            <button id="btnJa">日本語</button>
          </div>

          <button
            class="nav__toggle"
            id="navToggleBtn"
            aria-expanded="false"
            aria-label="Toggle menu">

            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </header>
      <!--
      <a href="#about" data-nav="about"></a>
      <a href="#projects" data-nav="projects"></a>
      <a href="#gallery" data-nav="gallery"></a>
      <a href="#contact" data-nav="contact"></a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button id="btnEn" type="button">EN</button>
        <button id="btnJa" type="button">日本語</button>
      </div>
    </nav> --> 

    <button class="nav-toggle-btn" id="navToggleBtn" aria-label="Toggle menu" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 5h16M2 10h16M2 15h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main id="top">

  <!-- ================= HERO ================= -->
  <section class="hero">
    <!-- decorative twilight sky and stars, injected by script.js -->
    <div class="sky-layer" id="skyLayer" aria-hidden="true"></div>

    <div class="wrap hero-inner">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 class="hero-title">
        <span id="heroName">Joe Kuwano</span>
      </h1>
      <p class="tagline" id="heroTagline"></p>
      <div class="hero-cta">
        <a href="#projects" class="btn btn-primary" id="heroCtaProjects"></a>
        <a href="#gallery" class="btn btn-ghost" id="heroCtaGallery"></a>
      </div>
    </div>

    <!-- signature element: dotted trail with a drifting little craft, both
         living in the same SVG coordinate space so they always line up -->
    <svg class="orbit-path" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
      <path id="orbitCurve" d="M -50 220 C 250 60, 650 340, 1250 90" fill="none" stroke="rgba(234,243,255,0.28)" stroke-width="1.5" stroke-dasharray="1 10" stroke-linecap="round"/>
      <g class="orbit-craft-group">
        <path d="M-9 -6 L11 0 L-9 6 L-3 0 Z" fill="#EAF3FF" stroke="#8FC1E8" stroke-width="1"/>
        <animateMotion dur="26s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
          <mpath href="#orbitCurve" xlink:href="#orbitCurve"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="26s" repeatCount="indefinite"/>
      </g>
    </svg>

    <div class="hero-horizon" aria-hidden="true">
      <svg viewBox="0 0 1440 180" preserveAspectRatio="none" width="100%" height="100%">
        <path d="M0,90 C180,40 320,140 500,100 C680,60 800,150 1000,110 C1180,75 1300,130 1440,95 L1440,180 L0,180 Z" fill="var(--cloud-far)"/>
        <path d="M0,130 C220,90 380,170 620,130 C820,100 980,175 1200,140 C1320,120 1400,150 1440,135 L1440,180 L0,180 Z" fill="var(--cloud-near)"/>
      </svg>
    </div>

    <button class="scroll-cue" id="scrollCue" onclick="document.getElementById('about').scrollIntoView({behavior:'smooth'})">
      <span id="scrollCueText"></span>
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 4 L7 10 L12 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>

  <!-- ================= ABOUT ================= -->
  <section class="section section-light" id="about">
    <div class="wrap about-grid">
      <div class="about-text">
        <p class="section-eyebrow" id="aboutEyebrow"></p>
        <h2 id="aboutHeading"></h2>
        <p class="about-body" id="aboutBody"></p>
        <div class="about-facts" id="aboutFacts"></div>
      </div>
      <div class="about-portrait" aria-hidden="true">
        <div class="moon-frame">
          <svg viewBox="0 0 220 220" width="100%" height="100%">
            <circle cx="110" cy="110" r="104" fill="var(--moon)"/>
            <circle cx="80" cy="70" r="14" fill="var(--moon-shadow)" opacity="0.5"/>
            <circle cx="140" cy="130" r="22" fill="var(--moon-shadow)" opacity="0.4"/>
            <circle cx="150" cy="60" r="9" fill="var(--moon-shadow)" opacity="0.4"/>
          </svg>
          <span class="moon-orbit-dot"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= PROJECTS ================= -->
  <section class="section section-dark" id="projects">
    <div class="wrap">
      <div class="section-head">
        <p class="section-eyebrow" id="projectsEyebrow"></p>
        <h2 id="projectsHeading"></h2>
        <p class="section-intro" id="projectsIntro"></p>
      </div>
      <div class="project-list" id="projectList"></div>
    </div>
  </section>

  <!-- ================= GALLERY ================= -->
  <section class="section section-light" id="gallery">
    <div class="wrap">
      <div class="section-head">
        <p class="section-eyebrow" id="galleryEyebrow"></p>
        <h2 id="galleryHeading"></h2>
        <p class="section-intro" id="galleryIntro"></p>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </section>

  <!-- ================= CONTACT ================= -->
  <section class="section section-void" id="contact">
    <div class="wrap contact-wrap">
      <p class="section-eyebrow" id="contactEyebrow"></p>
      <h2 id="contactHeading"></h2>
      <p class="section-intro" id="contactIntro"></p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span id="footerText"></span>
    <div class="lang-toggle lang-toggle-footer" role="group" aria-label="Language">
      <button id="btnEnFooter" type="button">EN</button>
      <button id="btnJaFooter" type="button">日本語</button>
    </div>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <img id="lightboxImg" src="" alt="" />
  <p class="lightbox-caption" id="lightboxCaption"></p>
</div>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
